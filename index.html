<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>
<style>
  body {
    background: #ffd6e8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
  }
  .box {
    background: white;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .emoji {
    font-size: 70px;
    margin-bottom: 10px;
  }
  h2 {
    margin-bottom: 20px;
  }
  button {
    padding: 10px 25px;
    border-radius: 20px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    margin: 8px;
  }
  #yes {
    background: #ff4d6d;
    color: white;
  }
  #no {
    background: #e0e0e0;
    position: absolute;
  }
</style>
</head>

<body>
<div class="box">
  <div class="emoji">🐻💖</div>
  <h2>Jyo, will you be my Valentine?</h2>
  <button id="yes" onclick="alert('YAYYY 💕🥹')">Yes</button>
  <button id="no">No</button>
</div>

<script>
  const noBtn = document.getElementById("no");
  noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  });
</script>
</body>
</html>
